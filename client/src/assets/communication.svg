<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background & Accent Gradients -->
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="chatGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Decorative Connections & Nodes -->
  <g opacity="0.4">
    <circle cx="400" cy="400" r="320" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="400" cy="400" r="230" fill="none" stroke="#4B5563" stroke-width="2" />
    
    <!-- Pulse Lines -->
    <path d="M 170 400 A 230 230 0 0 1 630 400" fill="none" stroke="url(#yellowGlow)" stroke-width="3" stroke-linecap="round" />
    <path d="M 400 170 A 230 230 0 0 1 400 630" fill="none" stroke="url(#redGlow)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central Messaging Platform Shield / Hub -->
  <g filter="url(#shadow)">
    <!-- Outer Ring -->
    <circle cx="400" cy="400" r="140" fill="url(#cardGrad)" stroke="#374151" stroke-width="4" />
    <circle cx="400" cy="400" r="110" fill="#111827" stroke="url(#yellowGlow)" stroke-width="3" filter="url(#glowYellow)" />
    
    <!-- Central Chat Icon -->
    <path d="M 350 370 C 350 336.86 372.38 310 400 310 C 427.62 310 450 336.86 450 370 C 450 403.14 427.62 430 400 430 C 388 430 376.8 425.2 368 417 L 340 425 L 348 399 C 349.3 390 350 380 350 370 Z" fill="url(#yellowGlow)" />
    <!-- Three Typing Dots -->
    <circle cx="380" cy="370" r="6" fill="#111827" />
    <circle cx="400" cy="370" r="6" fill="#111827" />
    <circle cx="420" cy="370" r="6" fill="#111827" />
  </g>

  <!-- Floating Feature Card 1: Person 1 (Top Left) -->
  <g transform="translate(100, 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="110" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="2" />
    <!-- Avatar -->
    <circle cx="45" cy="55" r="24" fill="url(#yellowGlow)" />
    <!-- Avatar Person SVG -->
    <circle cx="45" cy="48" r="9" fill="#111827" />
    <path d="M 33 67 C 33 60 38 56 45 56 C 52 56 57 60 57 67 Z" fill="#111827" />
    
    <!-- Message lines -->
    <rect x="85" y="40" width="100" height="10" rx="5" fill="#E5E7EB" />
    <rect x="85" y="60" width="70" height="8" rx="4" fill="#9CA3AF" />
    
    <!-- Online status badge -->
    <circle cx="61" cy="71" r="6" fill="#10B981" stroke="#111827" stroke-width="2" />
  </g>

  <!-- Floating Feature Card 2: Incoming Message (Top Right) -->
  <g transform="translate(480, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="95" rx="20" fill="url(#redGlow)" />
    <path d="M 40 30 H 170 M 40 50 H 130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="175" cy="65" r="14" fill="#FFFFFF" opacity="0.3" />
    <!-- Heart / Like Icon -->
    <path d="M 175 62 C 172 58 167 60 167 64 C 167 68 175 73 175 73 C 175 73 183 68 183 64 C 183 60 178 58 175 62 Z" fill="#FFFFFF" />
  </g>

  <!-- Floating Feature Card 3: Video Call Notification (Bottom Left) -->
  <g transform="translate(110, 520)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="100" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="2" />
    <!-- Video Camera Circle -->
    <circle cx="50" cy="50" r="24" fill="#374151" />
    <!-- Camera Icon -->
    <rect x="38" y="42" width="16" height="16" rx="3" fill="#F59E0B" />
    <path d="M 54 47 L 62 43 V 57 L 54 53 Z" fill="#F59E0B" />
    
    <text x="88" y="46" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Video Call</text>
    <text x="88" y="66" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">Connected • 04:12</text>
  </g>

  <!-- Floating Feature Card 4: Audio / Voice Note (Bottom Right) -->
  <g transform="translate(470, 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="110" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="2" />
    <!-- Avatar -->
    <circle cx="45" cy="55" r="22" fill="url(#redGlow)" />
    <circle cx="45" cy="49" r="8" fill="#FFFFFF" />
    <path d="M 34 66 C 34 60 39 56 45 56 C 51 56 56 60 56 66 Z" fill="#FFFFFF" />
    
    <!-- Audio Waveform -->
    <g transform="translate(85, 45)" fill="#F59E0B">
      <rect x="0" y="8" width="4" height="12" rx="2" />
      <rect x="8" y="3" width="4" height="22" rx="2" fill="#EF4444" />
      <rect x="16" y="0" width="4" height="28" rx="2" />
      <rect x="24" y="6" width="4" height="16" rx="2" fill="#EF4444" />
      <rect x="32" y="10" width="4" height="8" rx="2" />
      <rect x="40" y="2" width="4" height="24" rx="2" />
      <rect x="48" y="7" width="4" height="14" rx="2" />
      <rect x="56" y="11" width="4" height="6" rx="2" />
    </g>
    <text x="85" y="90" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Voice note (0:15)</text>
  </g>

  <!-- Sparkles & Floating Dots -->
  <circle cx="260" cy="110" r="4" fill="#F59E0B" />
  <circle cx="710" cy="310" r="6" fill="#EF4444" />
  <circle cx="100" cy="380" r="5" fill="#10B981" />
  <circle cx="680" cy="650" r="4" fill="#F59E0B" />

  <!-- Floating Emoji Badges -->
  <g transform="translate(370, 110)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="26" fill="#1F2937" stroke="#F59E0B" stroke-width="2" />
    <text x="18" y="38" font-size="24">🚀</text>
  </g>
  <g transform="translate(640, 380)" filter="url(#shadow)">
    <circle cx="25" cy="25" r="22" fill="#1F2937" stroke="#EF4444" stroke-width="2" />
    <text x="15" y="33" font-size="20">⚡</text>
  </g>
</svg>
